# Keep the CLI project aligned with the production VITE_SUPABASE_URL.
# Change this only when the frontend and hosting environment use the same
# replacement Supabase project.
project_id = "ckawqslkbanqolbvdpgf"

[functions.telegram-webhook]
verify_jwt = false

[functions.subscription-cron]
verify_jwt = false

# These endpoints are reached before a user has a session. The function code
# performs its own validation and keeps the password-reset response generic.
[functions.request-password-reset]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

# These functions perform their own role/session checks as well, but keeping
# gateway JWT verification enabled prevents unauthenticated traffic from
# reaching protected email/admin handlers.
[functions.send-verification-email]
verify_jwt = true

[functions.send-announcement]
verify_jwt = true

[functions.import-template]
verify_jwt = true

[functions.notify-payment-submitted]
verify_jwt = true
